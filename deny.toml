# cargo-deny configuration for Muzon.
# Enforces TZ.md §4.6: dependencies must be MIT/Apache/BSD/CC0/ISC/Unicode-DFS-2016.
# MPL-2.0 is allowed with copyleft limited to the modified file.
# GPL/AGPL/SSPL/Commons-Clause/Elastic-source-license are forbidden.

[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[forbidden]
# GPL/AGPL family is forbidden per TZ §4.6 ("GPL/AGPL — нет").
allow = []
deny = [
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-1.0",
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "SSPL-1.0",
    "Elastic-2.0",
    "Commons-Clause",
    "BUSL-1.1",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
