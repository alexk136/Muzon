[package]
name = "muzon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Muzon CLI binary: muzon play, queue, playlist, library, skin subcommands."

[[bin]]
name = "muzon"
path = "src/main.rs"

[dependencies]
muzon-core = { workspace = true }
muzon-library = { workspace = true }
muzon-audio = { workspace = true }
muzon-ipc = { workspace = true }
muzon-ui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
signal-hook = "0.3"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "fs", "process", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
