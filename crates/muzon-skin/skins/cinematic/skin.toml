[skin]
id = "cinematic"
name = "Cinematic Skin"
version = "0.1.0"
author = "Muzon contributors"
license = "MIT OR Apache-2.0"
min_muzon_version = "0.3.0"

[theme]
mode = "dark"
accent = "#f43f5e"
palette = "theme.css"

[layout]
main_template = "index.html.tmpl"
mini_template = "mini.html.tmpl"
grid = "top-main-player"

[layers]
background = ["assets/bg/*"]
main       = ["assets/main/*"]
buttons    = ["assets/buttons/*"]
spectrum   = ["assets/spectrum/*"]
