[package]
name = "muzon-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Muzon IPC: Unix socket (XDG_RUNTIME_DIR) and D-Bus surface for headless muzon-core."

[dependencies]
anyhow = { workspace = true }
libc = "0.2"
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "fs", "process", "signal", "time"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.10"
