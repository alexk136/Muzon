<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muzon — Modern Player</title>
  <!-- Active skin CSS is injected here at startup by app.js -->
  <style id="muzon-skin"></style>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    /* PlayerScreen-specific styles. The skin's theme.css
       provides the palette and component styles. This file
       adds the PlayerScreen-only bits (cover glow, AI
       chip pulse, etc.). */
    body { margin: 0; }
    .app-shell { display: grid; grid-template-rows: 56px 1fr 96px; grid-template-columns: 240px 1fr; grid-template-areas: "topbar topbar" "sidebar main" "player player"; height: 100vh; }
    .topbar { grid-area: topbar; display: flex; align-items: center; padding: 0 20px; background: var(--bg-1); border-bottom: 1px solid var(--border); gap: 16px; }
    .logo { font-weight: 800; font-size: 18px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-tabs { display: flex; gap: 4px; margin-left: 24px; }
    .nav-tab { padding: 6px 14px; border-radius: 8px; color: var(--text-1); font-size: 14px; font-weight: 500; cursor: pointer; border: 0; background: transparent; font-family: inherit; }
    .nav-tab.active { background: var(--bg-3); color: var(--text-0); }
    .search { flex: 1; max-width: 480px; margin: 0 auto; position: relative; }
    .search input { width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-0); padding: 8px 14px 8px 36px; border-radius: 10px; font-size: 14px; outline: none; font-family: inherit; box-sizing: border-box; }
    .sidebar { grid-area: sidebar; background: var(--bg-1); border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto; }
    .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-2); padding: 0 8px 8px; font-weight: 600; }
    .side-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--text-1); cursor: pointer; margin-bottom: 2px; }
    .side-item.active { background: var(--bg-3); color: var(--text-0); }
    .side-item .count { margin-left: auto; font-size: 11px; color: var(--text-2); }
    .main { grid-area: main; overflow-y: auto; padding: 32px; }
    .now-playing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; max-width: 1100px; margin: 0 auto; }
    @media (max-width: 900px) { .now-playing-grid { grid-template-columns: 1fr; gap: 24px; } }
    .cover { aspect-ratio: 1; border-radius: 20px; background: radial-gradient(circle at 30% 30%, var(--accent-2), transparent 50%), radial-gradient(circle at 70% 70%, var(--accent), transparent 50%), linear-gradient(135deg, var(--bg-2), var(--bg-1)); box-shadow: 0 30px 80px color-mix(in srgb, var(--accent) 30%, transparent); position: relative; overflow: hidden; }
    .cover::after { content: "♪"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: var(--text-0); opacity: 0.5; }
    .track-info { padding: 20px 0; }
    .track-label { display: inline-block; background: var(--bg-3); color: var(--text-1); padding: 4px 10px; border-radius: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .track-title { font-size: 42px; font-weight: 800; line-height: 1.1; margin: 0 0 12px; }
    .track-artist { font-size: 20px; color: var(--text-1); margin: 0 0 24px; }
    .track-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin-bottom: 32px; flex-wrap: wrap; }
    .spectrum { height: 120px; background: var(--bg-2); border-radius: 12px; padding: 16px; display: flex; align-items: flex-end; gap: 3px; border: 1px solid var(--border); }
    .bar { flex: 1; background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-radius: 2px 2px 0 0; min-height: 4px; animation: pulse 1.2s ease-in-out infinite; transform-origin: bottom; }
    @keyframes pulse { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    .bar:nth-child(odd) { animation-delay: 0.3s; }
    .bar:nth-child(1)  { height: 30%; } .bar:nth-child(2)  { height: 70%; } .bar:nth-child(3)  { height: 50%; } .bar:nth-child(4)  { height: 90%; } .bar:nth-child(5)  { height: 60%; } .bar:nth-child(6)  { height: 80%; } .bar:nth-child(7)  { height: 40%; } .bar:nth-child(8)  { height: 95%; } .bar:nth-child(9)  { height: 55%; } .bar:nth-child(10) { height: 75%; }
    .ai-row { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
    .ai-chip { background: var(--bg-2); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--text-1); display: flex; align-items: center; gap: 6px; }
    .ai-chip .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
    .player { grid-area: player; background: var(--bg-1); border-top: 1px solid var(--border); display: grid; grid-template-columns: 280px 1fr 280px; align-items: center; padding: 0 20px; gap: 20px; }
    .p-track { display: flex; align-items: center; gap: 12px; }
    .p-cover { width: 56px; height: 56px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); display: flex; align-items: center; justify-content: center; color: var(--text-0); font-size: 24px; flex-shrink: 0; }
    .p-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-artist { font-size: 12px; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .p-buttons { display: flex; align-items: center; gap: 12px; }
    .p-btn { background: transparent; border: 0; color: var(--text-1); cursor: pointer; font-size: 16px; padding: 4px; }
    .p-btn:hover { color: var(--text-0); }
    .p-play { width: 40px; height: 40px; background: var(--text-0); color: var(--bg-0); border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .p-progress { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 600px; font-size: 11px; color: var(--text-2); }
    .p-progress-bar { flex: 1; height: 4px; background: var(--bg-3); border-radius: 2px; position: relative; }
    .p-progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 38%; background: var(--accent); border-radius: 2px; }
    .p-volume { display: flex; align-items: center; gap: 8px; color: var(--text-1); }
    .p-volume-bar { width: 100px; height: 4px; background: var(--bg-3); border-radius: 2px; position: relative; }
    .p-volume-fill { position: absolute; left: 0; top: 0; height: 100%; width: 70%; background: var(--text-1); border-radius: 2px; }
    .empty { text-align: center; padding: 80px 20px; color: var(--text-1); }
    .empty h1 { color: var(--text-0); margin: 0 0 12px; }
    .empty button { background: var(--accent); color: var(--text-0); border: 0; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="logo">Muzon</div>
      <nav class="nav-tabs">
        <button class="nav-tab active">Player</button>
        <button class="nav-tab">Library</button>
        <button class="nav-tab">MusicLab</button>
        <button class="nav-tab">Settings</button>
      </nav>
      <div class="search"><input type="text" placeholder="Search..." /></div>
    </header>
    <aside class="sidebar">
      <div class="side-title">Navigation</div>
      <div class="side-item active">♪ Now playing</div>
      <div class="side-item">💿 Albums <span class="count" id="album-count">0</span></div>
      <div class="side-item">🎤 Artists <span class="count" id="artist-count">0</span></div>
      <div class="side-title">Playlists</div>
      <div class="side-item">📁 All music <span class="count" id="track-count">0</span></div>
    </aside>
    <main class="main" id="main"></main>
    <footer class="player">
      <div class="p-track">
        <div class="p-cover">♪</div>
        <div>
          <div class="p-title" id="p-title">No track</div>
          <div class="p-artist" id="p-artist">—</div>
        </div>
      </div>
      <div class="p-center">
        <div class="p-buttons">
          <button class="p-btn" id="btn-shuffle" title="Shuffle">SHF</button>
          <button class="p-btn" id="btn-prev" title="Previous">PRE</button>
          <button class="p-btn p-play" id="btn-play" title="Play/Pause">▶</button>
          <button class="p-btn" id="btn-next" title="Next">NXT</button>
          <button class="p-btn" id="btn-repeat" title="Repeat">RPT</button>
        </div>
        <div class="p-progress">
          <span id="p-position">0:00</span>
          <div class="p-progress-bar"><div class="p-progress-fill" id="p-progress" style="width: 0%;"></div></div>
          <span id="p-duration">0:00</span>
        </div>
      </div>
      <div class="p-volume">
        <span>Vol</span>
        <div class="p-volume-bar"><div class="p-volume-fill" id="p-volume" style="width: 70%;"></div></div>
      </div>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
